<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>치즈쿠키 가계부</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="치즈쿠키">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF8E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#231A18" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&display=swap">
<style>
/* Layout: a pocket recipe-card notebook — butter-yellow summary card with a pink gingham band, then three sticker tabs (기록 / 예산 / 수입) */
:root{
  --bg:#FFF8E4; --bg-dot:#F9E7B5; --card:#FFFDF7; --ink:#4B3A35; --muted:#9A857C; --line:#F1DFC7;
  --butter:#FFE9A3; --butter-soft:#FFF3CF; --pink:#F6A9BE; --pink-soft:#FDE4EB; --pink-ink:#B9506E;
  --edge:#5A4540; --shadow:#F4B6C6; --shadow-y:#F3D77E;
  --accent:var(--pink); --accent-soft:var(--pink-soft); --accent-ink:var(--pink-ink);
  --good:#4E9E7A; --good-soft:#E3F3EA; --warn:#C88A2A; --warn-soft:#FFF0CC; --bad:#D4536B; --bad-soft:#FCE1E6;
  --chip:#FFF1D2; --onaccent:#4B3A35;
  --f-display:"Dongle","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Dongle","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#231A18; --bg-dot:#2E2320; --card:#2D2321; --ink:#F7EADF; --muted:#BBA59B; --line:#45362F;
  --butter:#E8CF7A; --butter-soft:#3A3021; --pink:#F2A3B9; --pink-soft:#46282F; --pink-ink:#FFC3D2;
  --edge:#F2DCCD; --shadow:#7A3E4E; --shadow-y:#6B5726;
  --good:#7FD1AA; --good-soft:#1F3A2E; --warn:#F0C06A; --warn-soft:#3D3120; --bad:#FF8DA0; --bad-soft:#47232B;
  --chip:#3A2E28; --onaccent:#3A2622; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#231A18; --bg-dot:#2E2320; --card:#2D2321; --ink:#F7EADF; --muted:#BBA59B; --line:#45362F;
  --butter:#E8CF7A; --butter-soft:#3A3021; --pink:#F2A3B9; --pink-soft:#46282F; --pink-ink:#FFC3D2;
  --edge:#F2DCCD; --shadow:#7A3E4E; --shadow-y:#6B5726;
  --good:#7FD1AA; --good-soft:#1F3A2E; --warn:#F0C06A; --warn-soft:#3D3120; --bad:#FF8DA0; --bad-soft:#47232B;
  --chip:#3A2E28; --onaccent:#3A2622; color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.4px,transparent 1.6px);background-size:18px 18px;color:var(--ink);font-family:var(--f-body);font-size:21px;line-height:1.25;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-variant-numeric:tabular-nums}
b,strong{font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px dashed var(--pink-ink);outline-offset:3px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:23px;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.brand em{font-style:normal;font-size:17px;font-family:var(--f-body);font-weight:400;background:var(--pink-soft);color:var(--pink-ink);border-radius:999px;padding:2px 8px;letter-spacing:0}
.pig{width:38px;height:38px;flex:none}
.month{display:flex;align-items:center;gap:2px;background:var(--card);border:1.5px solid var(--edge);border-radius:999px;padding:3px;box-shadow:2px 2px 0 var(--shadow-y)}
.month button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--muted)}
.month button:hover{background:var(--butter-soft);color:var(--ink)}
.month span{font-family:var(--f-display);font-weight:700;font-size:21px;min-width:96px;text-align:center}

.note{font-size:18px;border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px dashed currentColor}
.note.sample{background:var(--butter-soft);color:var(--warn)}
.note.info{background:var(--card);color:var(--muted)}
.note button{border:1.5px solid var(--edge);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:18px;box-shadow:2px 2px 0 var(--shadow)}

/* hero: butter card with gingham band */
.hero{position:relative;background:var(--butter-soft);border-radius:28px;padding:34px 22px 20px;border:1.5px solid var(--edge);display:flex;flex-direction:column;gap:14px;box-shadow:5px 5px 0 var(--shadow);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:16px;border-bottom:1.5px solid var(--edge);
  background-color:var(--card);background-image:linear-gradient(90deg,color-mix(in srgb,var(--pink) 55%,transparent) 50%,transparent 50%),linear-gradient(color-mix(in srgb,var(--pink) 55%,transparent) 50%,transparent 50%);background-size:16px 16px}
.hero .lbl{font-size:19px;color:var(--muted)}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1.1;letter-spacing:-1px}
.hero .big small{font-size:20px;margin-left:3px;font-weight:400;letter-spacing:0}
.hero .big.over{color:var(--bad)}
.bar{height:14px;background:var(--card);border:1.5px solid var(--edge);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.3,1.4,.5,1);
  background:repeating-linear-gradient(-45deg,var(--pink) 0 7px,color-mix(in srgb,var(--pink) 70%,var(--card)) 7px 14px)}
.bar.thin{height:9px;border-width:1px}
.bar i.ok{background:repeating-linear-gradient(-45deg,var(--pink) 0 6px,color-mix(in srgb,var(--pink) 70%,var(--card)) 6px 12px)}
.bar i.warn{background:repeating-linear-gradient(-45deg,var(--warn) 0 6px,color-mix(in srgb,var(--warn) 70%,var(--card)) 6px 12px)}
.bar i.bad{background:var(--bad)}
.barcap{display:flex;justify-content:space-between;gap:8px;font-size:18px;color:var(--muted);margin-top:7px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:16px;padding:10px 12px;min-width:0;border:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:16px;color:var(--muted)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1.5px solid var(--edge);border-radius:999px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:3px 3px 0 var(--shadow-y)}
.tabs button{border:0;background:none;border-radius:999px;padding:9px 0;font-size:20px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--pink);color:var(--onaccent);font-weight:700}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.card{background:var(--card);border:1.5px solid var(--edge);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:3px 3px 0 var(--line)}
.card h2{font-family:var(--f-display);font-size:19px;font-weight:700;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 small{font-family:var(--f-body);font-size:18px;color:var(--muted);font-weight:400}
.field{display:flex;flex-direction:column;gap:7px}
.field>label{font-size:18px;color:var(--muted)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 12px;font-size:21px;min-width:0}
.inp:focus{border-color:var(--pink);background:var(--card);outline:none;box-shadow:0 0 0 3px var(--pink-soft)}
.money{position:relative}
.money .inp{padding-right:34px;font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.money::after{content:"원";position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px}
.money.sm .inp{font-size:22px;padding-block:9px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:4px 11px;font-size:18px;color:var(--muted)}
.quick button:hover{color:var(--ink);background:var(--butter-soft);border-style:solid}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px 6px 10px;font-size:20px;display:inline-flex;gap:5px;align-items:center;transition:transform .15s,box-shadow .15s}
.chip:hover{border-color:var(--edge)}
.chip[aria-pressed="true"]{background:var(--pink-soft);border-color:var(--edge);color:var(--ink);box-shadow:2px 2px 0 var(--shadow);transform:translate(-1px,-1px)}
.left-hint{font-size:18px;border-radius:14px;padding:9px 12px;background:var(--butter-soft);color:var(--muted)}
.left-hint b{color:var(--ink);font-family:var(--f-display)}
.left-hint.bad{background:var(--bad-soft)}
.left-hint.bad b{color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 150px;gap:8px}
.btn{border:1.5px solid var(--edge);background:var(--pink);color:var(--onaccent);border-radius:16px;padding:13px;font-weight:700;font-size:22px;box-shadow:3px 3px 0 var(--edge);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--butter-soft);color:var(--ink);box-shadow:2px 2px 0 var(--shadow-y)}
.err{color:var(--bad);font-size:18px}
.err:empty{display:none}

/* list */
.day{font-size:18px;color:var(--muted);padding-top:6px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:38px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1.5px dotted var(--line)}
.item:first-child{border-top:0}
.ico{width:38px;height:38px;border-radius:50%;background:var(--butter-soft);display:grid;place-items:center;font-size:18px;flex:none;border:1px solid var(--line)}
.item .t{min-width:0}
.item .t b{display:block;font-weight:400;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:17px;color:var(--muted)}
.item .amt{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--muted);border-radius:10px;padding:4px 7px;font-size:18px}
.x:hover{background:var(--pink-soft)}
.x.confirm{background:var(--bad-soft);color:var(--bad);font-weight:700}
.empty{color:var(--muted);font-size:19px;text-align:center;padding:14px 0}

/* category rows */
.cat{display:flex;flex-direction:column;gap:7px;padding:12px 0;border-top:1.5px dotted var(--line)}
.cat:first-child{border-top:0;padding-top:0}
.cat-h{display:flex;align-items:center;gap:10px}
.cat-h .name{flex:1;min-width:0}
.cat-h .rem{font-size:19px;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rem.ok{color:var(--pink-ink)} .rem.warn{color:var(--warn)} .rem.bad{color:var(--bad)}
.cat-sub{display:flex;justify-content:space-between;font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
.edit-row{display:grid;grid-template-columns:1fr 150px 30px;gap:8px;align-items:center}
.edit-row .inp{padding:8px 10px;font-size:20px}
.edit-row .nm{display:flex;align-items:center;gap:10px;min-width:0}
.edit-row .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .ck{font-size:15px;font-weight:700;color:var(--pink-ink)}
.alloc{display:flex;justify-content:space-between;align-items:center;font-size:18px;border-radius:14px;padding:10px 12px;gap:8px;flex-wrap:wrap}
.alloc b{font-family:var(--f-display)}
.alloc.ok{background:var(--pink-soft);color:var(--pink-ink)}
.alloc.warn{background:var(--butter-soft);color:var(--warn)}
.alloc.bad{background:var(--bad-soft);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--card);color:var(--ink);border:1.5px solid var(--edge);box-shadow:3px 3px 0 var(--shadow);padding:10px 18px;border-radius:999px;font-size:20px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{font-size:17px;color:var(--muted);text-align:center}
@media (max-width:420px){
  .hero .big{font-size:34px}
  .row2{grid-template-columns:1fr}
  .edit-row{grid-template-columns:1fr 124px 28px}
  .stat{padding:9px 10px}
  .stat b{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Dongle runs small: scale every display-face element up, tighten line height */
.brand{font-size:34px;line-height:1;letter-spacing:0}
.month span{font-size:24px;line-height:1}
.hero .big{font-size:64px;line-height:.9;letter-spacing:0}
.hero .big small{font-size:28px}
.stat b{font-size:23px;line-height:1.05}
.card h2{font-size:28px;line-height:1}
.money .inp{font-size:32px;line-height:1;padding-block:7px}
.money.sm .inp{font-size:24px;padding-block:5px}
.item .amt{font-size:23px;line-height:1}
.cat-h .rem{font-size:21px;line-height:1}
.left-hint b,.alloc b{font-size:19px;line-height:1}
.tabs button{font-family:var(--f-display);font-size:23px;line-height:1;padding:8px 0 6px;white-space:nowrap}
.btn{font-family:var(--f-display);font-size:25px;line-height:1;padding:11px 13px 9px}
.chip{font-family:var(--f-display);font-size:21px;line-height:1;padding:5px 13px 5px 7px;gap:5px}
.chip .ic{flex:none}
.chip .ck{font-family:var(--f-body);margin-left:2px}
.hero .big span{font-size:30px!important}
/* drawn icons */
.ic{display:block}
.ic *{fill:none;stroke:var(--edge);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.ic .f1{fill:var(--butter)} .ic .f2{fill:var(--pink)} .ic .w{fill:var(--card)}
.ic .n{stroke:none} .ic .hl{stroke:var(--card);stroke-width:1.6}
.ico{background:var(--butter-soft)}
.mine{font-style:normal;font-size:16px;color:var(--pink-ink);background:var(--pink-soft);border-radius:999px;padding:1px 7px;flex:none}
.addmine{align-self:flex-start;border:1.5px dashed var(--pink-ink);background:transparent;color:var(--pink-ink);border-radius:999px;padding:6px 14px 4px;font-family:var(--f-display);font-size:21px;line-height:1}
.addmine:hover{background:var(--pink-soft)}
.customform{display:flex;flex-direction:column;gap:12px;background:var(--butter-soft);border:1.5px dashed var(--edge);border-radius:18px;padding:14px}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.pick{border:1.5px solid var(--line);background:var(--card);border-radius:14px;height:44px;display:grid;place-items:center}
.pick[aria-pressed="true"]{border-color:var(--edge);background:var(--pink-soft);box-shadow:2px 2px 0 var(--shadow)}
@media (max-width:420px){.hero .big{font-size:54px}.stat b{font-size:20px}}
.plabel{width:auto!important;border-radius:999px!important;padding:0 8px;display:inline-flex;align-items:center;gap:5px;color:var(--ink)!important;font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1}
.plabel:hover{background:var(--pink-soft)!important}
.days{font-size:19px;color:var(--ink);margin-top:4px}
.days b{color:var(--pink-ink)}
.row2.even{grid-template-columns:1fr 1fr}
input[type=date].inp{font-size:20px;padding-block:8px}
@media (max-width:420px){.row2.even{grid-template-columns:1fr 1fr}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg class="pig" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="21" r="16" fill="var(--butter)" stroke="var(--edge)" stroke-width="1.6"/>
        <circle cx="20" cy="21" r="12.5" fill="none" stroke="var(--shadow-y)" stroke-width="1.4" stroke-dasharray="2 3"/>
        <circle cx="13" cy="17" r="2.2" fill="var(--shadow-y)"/><circle cx="25" cy="27" r="2.6" fill="var(--shadow-y)"/><circle cx="14.5" cy="27.5" r="1.6" fill="var(--shadow-y)"/>
        <path d="M23 12.5c0-2 2.6-2.7 3.6-.9 1-1.8 3.6-1.1 3.6.9 0 2.2-3.6 4.4-3.6 4.4S23 14.7 23 12.5z" fill="var(--pink)" stroke="var(--edge)" stroke-width="1.2"/>
      </svg>
      치즈쿠키 가계부
    </div>
    <div class="month">
      <button id="prevM" aria-label="이전 기간">◀</button>
      <button id="periodBtn" class="plabel num" aria-label="기간 바꾸기"><span id="monthLbl"></span><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z" fill="var(--pink)" stroke="var(--edge)" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
      <button id="nextM" aria-label="다음 기간">▶</button>
    </div>
  </div>

  <section class="card" id="periodForm" hidden>
    <h2>가계부 기간 <small>월급날에 맞춰 정해 보세요</small></h2>
    <div class="row2 even">
      <div class="field"><label for="pStart">시작하는 날</label><input class="inp" id="pStart" type="date"></div>
      <div class="field"><label for="pEnd">끝나는 날</label><input class="inp" id="pEnd" type="date"></div>
    </div>
    <div class="quick" id="pQuick">
      <button type="button" data-q="month">시작일부터 한 달</button>
      <button type="button" data-q="cal">1일 ~ 말일</button>
    </div>
    <div class="left-hint" id="pHint"></div>
    <div class="err" id="pErr"></div>
    <div style="display:flex;gap:8px"><button type="button" class="btn ghost" id="pCancel" style="flex:1">취소</button><button type="button" class="btn" id="pSave" style="flex:2">이 기간으로 정하기</button></div>
  </section>

  <div id="notes"></div>

  <section class="hero" aria-label="기간 요약">
    <div>
      <div class="lbl" id="heroLbl">이 기간에 더 쓸 수 있는 돈</div>
      <div class="big num" id="heroLeft"></div>
    </div>
    <div>
      <div class="bar"><i id="heroBar"></i></div>
      <div class="barcap num"><span id="heroSpent"></span><span id="heroGoal"></span></div>
      <div class="days num" id="heroDays"></div>
    </div>
    <div class="stats">
      <div class="stat"><span>이 기간 수입</span><b class="num" id="stIncome"></b></div>
      <div class="stat"><span>목표 지출</span><b class="num" id="stGoal"></b></div>
      <div class="stat"><span>남길 돈(저축)</span><b class="num" id="stSave"></b></div>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="log" aria-selected="true">지출 기록</button>
    <button role="tab" data-tab="budget" aria-selected="false">예산 나누기</button>
    <button role="tab" data-tab="income" aria-selected="false">수입</button>
  </nav>

  <!-- 지출 기록 -->
  <div id="tab-log" class="wrap" style="gap:14px">
    <form class="card" id="spendForm" autocomplete="off">
      <h2>돈 썼어요 <small id="todayLbl"></small></h2>
      <div class="field">
        <label for="spAmt">얼마 썼나요?</label>
        <div class="money"><input class="inp" id="spAmt" inputmode="numeric" placeholder="0"></div>

const ic=(k,s)=>`<svg class="ic" viewBox="0 0 24 24" width="${s||22}" height="${s||22}" aria-hidden="true">${ICONS[k]||ICONS.coin}</svg>`;
const INCOME_TYPES=[["salary","wallet","월급"],["allowance","letter","용돈"],["parttime","clock","알바비"],["side","sparkle","부수입"],["etc","coin","기타"]];
/* 기본 항목: 아이콘과 이름이 한 쌍. 내 항목(id가 u로 시작)은 이름·아이콘을 직접 고름 */
const PRESETS=[
 ["food","rice","식비"],["dessert","cup","커피와디저트"],["meet","cal","약속"],["love","heart","연애"],["travel","suitcase","여행"],
 ["daily","basket","생필품"],["subs","play","구독료"],["transit","bus","교통비"],["rent","house","월세"],["emergency","jar","비상금"]
];
const CUSTOM_ICONS=["star","gift","book","flower","paw","shirt","music","sparkle","heart","cup","suitcase","basket"];
const SAMPLE_BUDGET={food:300000,dessert:80000,meet:150000,love:120000,travel:100000,daily:60000,subs:40000,transit:80000,rent:450000,emergency:120000};
const OLD_MAP={coffee:"dessert",cafe:"dessert",friends:"meet",transport:"transit",phone:"subs",living:"daily"};
const preset=id=>PRESETS.find(p=>p[0]===id);
const isCustom=id=>/^u/.test(id||"");
function normCats(cats){
  const out={},custom=[];
  (cats||[]).forEach(c=>{
    if(isCustom(c.id)){custom.push({id:c.id,icon:ICONS[c.icon]?c.icon:"star",name:String(c.name||"내 항목").slice(0,10),budget:c.budget||0});return}
    const id=preset(c.id)?c.id:OLD_MAP[c.id];if(!id)return;out[id]=(out[id]||0)+(c.budget||0)});
  return PRESETS.filter(p=>p[0] in out).map(([k,i,n])=>({id:k,icon:i,name:n,budget:out[k]})).concat(custom);
}
function sortCats(){const o=id=>{const i=PRESETS.findIndex(p=>p[0]===id);return i<0?99:i};S.cats.sort((a,b)=>o(a.id)-o(b.id))}
function normSpends(sp){return (sp||[]).map(s=>preset(s.cat)||isCustom(s.cat)?s:{...s,cat:OLD_MAP[s.cat]||s.cat})}
const won=n=>(Math.round(n)||0).toLocaleString("ko-KR");
const parse=s=>{const n=parseInt(String(s).replace(/[^\d]/g,""),10);return isNaN(n)?0:n};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const todayStr=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
/* 기간: {id,start,end} (날짜는 YYYY-MM-DD, 끝 날짜 포함). id는 만들 때 정해지고 바뀌지 않음 */
const toD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return fmt(d)};
const addMonths=(s,n)=>{const d=toD(s),day=d.getDate();const t=new Date(d.getFullYear(),d.getMonth()+n,1);
  t.setDate(Math.min(day,new Date(t.getFullYear(),t.getMonth()+1,0).getDate()));return fmt(t)};
const nextAfter=p=>{const start=addDays(p.end,1);return {id:start,start,end:addDays(addMonths(start,1),-1)}};
const prevBefore=p=>{const end=addDays(p.start,-1);return {id:addMonths(addDays(end,1),-1),start:addMonths(addDays(end,1),-1),end}};
const daysBetween=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const shortD=s=>{const d=toD(s);return `${d.getMonth()+1}.${d.getDate()}`};
function calMonth(){const s=todayStr.slice(0,8)+"01";return {id:todayStr.slice(0,7),start:s,end:addDays(addMonths(s,1),-1)}}

function defaultCats(){return PRESETS.map(([k,i,n])=>({id:k,icon:i,name:n,budget:SAMPLE_BUDGET[k]}))}
function sampleState(p){
  const d=x=>{const v=addDays(p.start,x);return v>p.end?p.end:v};
  return {sample:true,goal:1500000,
    incomes:[{id:uid(),type:"salary",amount:1800000,memo:"예시 월급"},{id:uid(),type:"allowance",amount:200000,memo:"예시 용돈"}],
    cats:defaultCats(),
    spends:[
      {id:uid(),cat:"rent",amount:450000,memo:"이번 달 월세",date:d(0)},
      {id:uid(),cat:"subs",amount:17000,memo:"넷플릭스",date:d(0)},
      {id:uid(),cat:"transit",amount:55000,memo:"교통카드 충전",date:d(0)},
      {id:uid(),cat:"dessert",amount:4800,memo:"아이스 아메리카노",date:d(1)},
      {id:uid(),cat:"food",amount:9500,memo:"점심 제육덮밥",date:d(1)},
      {id:uid(),cat:"meet",amount:32000,memo:"동기들이랑 저녁",date:d(2)},
      {id:uid(),cat:"dessert",amount:7500,memo:"치즈케이크",date:d(2)},
      {id:uid(),cat:"love",amount:27000,memo:"영화 + 팝콘",date:d(3)}
    ]};
}
function blankFrom(prev){
  return {sample:false,carried:!!prev,goal:prev?prev.goal:0,
    incomes:prev?prev.incomes.map(i=>({...i,id:uid()})):[],
    cats:prev?normCats(prev.cats):[],spends:[]};
}

/* storage: private db when available, otherwise this browser */
let db=null,userId=null,S=null,P=null,META={started:false,periods:[]},saving=Promise.resolve(),saveTimer=null,metaDirty=false;
const lsGet=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const metaRef=()=>db.doc("data/users/"+userId+"/meta");
function ref(id){return db.collection("data/users/"+userId).doc(id)}
async function readDoc(id){
  if(db&&userId){try{const s=await ref(id).get();return s.exists?JSON.parse(JSON.stringify(s.data())):null}catch(e){return lsGet("ttgb:"+id)}}
  return lsGet("ttgb:"+id);
}
async function readMeta(){
  let m=null;
  if(db&&userId){try{const s=await metaRef().get();if(s.exists)m=JSON.parse(JSON.stringify(s.data()))}catch(e){}}
  if(!m)m=lsGet("ttgb:meta");
  m=m||{};m.started=!!m.started;m.periods=Array.isArray(m.periods)?m.periods:[];
  return m;
}
function sortPeriods(){META.periods.sort((a,b)=>a.start.localeCompare(b.start))}
function addPeriod(p){if(!META.periods.some(x=>x.id===p.id)){META.periods.push(p);sortPeriods();metaDirty=true}return META.periods.find(x=>x.id===p.id)}
function periodForToday(){
  let p=META.periods.find(x=>x.start<=todayStr&&todayStr<=x.end);if(p)return p;
  if(!META.periods.length)return addPeriod(calMonth());
  let last=META.periods[META.periods.length-1];
  if(todayStr>last.end){let g=0;while(todayStr>last.end&&g++<60)last=addPeriod(nextAfter(last));return last}
  return addPeriod(calMonth());
}
async function loadPeriod(p){
  let st=await readDoc(p.id);
  if(!st){
    const i=META.periods.findIndex(x=>x.id===p.id),prevP=META.periods[i-1];
    const prev=prevP?await readDoc(prevP.id):null;
    if(prev&&!prev.sample) st=blankFrom(prev);
    else st=META.started?blankFrom(null):sampleState(p);
  }
  st.cats=normCats(st.cats);st.spends=normSpends(st.spends);st.incomes=st.incomes||[];st.goal=st.goal||0;
  return st;
}
function save(){
  S.carried=false;
  render();
  clearTimeout(saveTimer);
  $("saveState").textContent="저장 중…";
  META.started=true;
  const id=P.id,snapshot=JSON.parse(JSON.stringify(S)),meta=JSON.parse(JSON.stringify(META));
  saveTimer=setTimeout(()=>{
    saving=saving.then(async()=>{
      lsSet("ttgb:"+id,snapshot);lsSet("ttgb:meta",meta);
      if(db&&userId){
        try{await ref(id).set(snapshot);await metaRef().set(meta);metaDirty=false;$("saveState").textContent="내 계정에 저장됐어요 · 다른 기기에서도 열 수 있어요";}
        catch(e){$("saveState").textContent="계정 저장에 실패해서 이 브라우저에만 저장했어요. 잠시 후 다시 입력해 보세요.";}
      } else $("saveState").textContent="이 폰에 저장됐어요";

}

/* derived */
const spentBy=c=>S.spends.filter(s=>s.cat===c).reduce((a,s)=>a+s.amount,0);
const totalSpent=()=>S.spends.reduce((a,s)=>a+s.amount,0);
const totalIncome=()=>S.incomes.reduce((a,s)=>a+s.amount,0);
const catOf=id=>{const c=S.cats.find(c=>c.id===id);if(c)return c;const p=preset(id);return p?{id,icon:p[1],name:p[2],budget:0}:{icon:"coin",name:"지운 항목",budget:0}};
function lvl(spent,budget){if(budget<=0)return spent>0?"bad":"ok";const r=spent/budget;return r>1?"bad":r>=.8?"warn":"ok"}

/* render */
let selCat=null,selInc="salary",tab="log",pendingDel=null;
function render(){
  $("monthLbl").textContent=`${shortD(P.start)} ~ ${shortD(P.end)}`;

  const hb=$("heroBar");hb.style.width=pct+"%";hb.className=lvl(spent,goal)==="ok"?"":lvl(spent,goal);

  $("heroDays").innerHTML=inP?`<b>D-${daysBetween(todayStr,P.end)}</b> · 남은 ${daysLeft}일${goal>0&&left>0?` · 하루에 <b>${won(Math.floor(left/daysLeft))}원</b>씩 쓸 수 있어요`:""}`
    :(todayStr<P.start?`${shortD(P.start)}에 시작하는 기간이에요`:`끝난 기간이에요 · 총 ${daysBetween(P.start,P.end)+1}일`);
  $("heroGoal").textContent=goal>0?`목표 ${won(goal)}원 중 ${Math.round(spent/goal*100)}%`:"";
  $("stIncome").textContent=won(inc)+"원";$("stGoal").textContent=won(goal)+"원";
  $("stSave").textContent=won(inc-goal)+"원";$("stSave").style.color=inc-goal<0?"var(--bad)":"";

  let notes="";
  if(S.sample) notes+=`<div class="note sample"><span>지금 보이는 숫자는 <b>예시</b>예요. 둘러보고 내 가계부를 시작하세요.</span><button type="button" id="clearSample">예시 지우고 시작</button></div>`;
  if(S.carried) notes+=`<div class="note info"><span>지난 기간의 수입·예산 설정을 그대로 가져왔어요. 바뀐 게 있으면 고쳐 주세요.</span></div>`;
  $("notes").innerHTML=notes;
  const cs=$("clearSample");if(cs)cs.onclick=()=>{S=blankFrom(null);S.sample=false;save();toast("새 가계부를 시작해요! 수입부터 넣어 볼까요?");setTab("income")};

  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  ["log","budget","income"].forEach(t=>$("tab-"+t).hidden=t!==tab);

  renderLog();renderBudget();renderIncome();
}
function renderLog(){
  if(selCat&&!S.cats.some(c=>c.id===selCat))selCat=null;
  $("spCats").innerHTML=S.cats.map(c=>`<button type="button" class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===selCat}">${ic(c.icon,18)}${esc(c.name)}</button>`).join("")||`<span class="empty">예산 나누기 탭에서 항목을 먼저 골라 주세요</span>`;
  updateHint();
  $("catStatus").innerHTML=S.cats.map(c=>{
    const sp=spentBy(c.id),l=lvl(sp,c.budget),rem=c.budget-sp,p=c.budget>0?Math.min(100,sp/c.budget*100):(sp>0?100:0);
    return `<div class="cat"><div class="cat-h"><span class="ico">${ic(c.icon)}</span><span class="name">${esc(c.name)}</span><span class="rem ${l}">${rem>=0?won(rem)+"원 남음":won(-rem)+"원 초과"}</span></div>
    <div class="bar thin"><i class="${l}" style="width:${p}%"></i></div>
    <div class="cat-sub"><span>${won(sp)}원 씀</span><span>예산 ${won(c.budget)}원</span></div></div>`}).join("")||`<div class="empty">아직 항목이 없어요</div>`;
  const list=[...S.spends].sort((a,b)=>b.date.localeCompare(a.date)||0);
  $("spCount").textContent=list.length?`${list.length}건`:"";
  if(!list.length){$("spList").innerHTML=`<div class="empty">아직 기록이 없어요. 위에서 첫 지출을 적어 보세요.</div>`;return}
  let html="",cur="";
  list.forEach(s=>{
    if(s.date!==cur){if(cur)html+="</div>";cur=s.date;const dt=new Date(s.date+"T00:00");const wd="일월화수목금토"[dt.getDay()];
      const dayTotal=list.filter(x=>x.date===cur).reduce((a,x)=>a+x.amount,0);
      html+=`<div class="day num" style="display:flex;justify-content:space-between"><span>${dt.getMonth()+1}월 ${dt.getDate()}일 (${wd})${s.date===todayStr?" · 오늘":""}</span><span>${won(dayTotal)}원</span></div><div class="list">`}
    const c=catOf(s.cat);
    html+=`<div class="item"><span class="ico">${ic(c.icon)}</span><div class="t"><b>${esc(s.memo||c.name)}</b><span>${esc(c.name)}</span></div><span class="amt">${won(s.amount)}원</span><button type="button" class="x${pendingDel===s.id?" confirm":""}" data-del="${s.id}" aria-label="삭제">${pendingDel===s.id?"삭제":"✕"}</button></div>`;
  });

}
function updateHint(){
  const h=$("catHint");
  if(!selCat){h.className="left-hint";h.textContent="항목을 고르면 남은 돈을 보여드려요.";return}
  const c=catOf(selCat),rem=c.budget-spentBy(selCat),amt=parse($("spAmt").value);
  const after=rem-amt;
  h.className="left-hint"+(after<0?" bad":"");
  h.innerHTML=amt>0
    ?`${esc(c.name)} 남은 돈 <b class="num">${won(rem)}원</b> → 기록하면 <b class="num">${after>=0?won(after)+"원":won(-after)+"원 초과"}</b>`
    :`${esc(c.name)}에 아직 <b class="num">${rem>=0?won(rem)+"원":"-"+won(-rem)+"원"}</b> 쓸 수 있어요`;
}
function renderBudget(){
  const gi=$("goalInp");if(document.activeElement!==gi)gi.value=S.goal?won(S.goal):"";
  const inc=totalIncome();
  $("goalPct").innerHTML=inc>0?[50,60,70,80].map(p=>`<button type="button" data-p="${p}">수입의 ${p}%</button>`).join(""):"";

  else if(S.goal>inc){gn.className="alloc bad";gn.innerHTML=`<span>목표가 수입보다 <b class="num">${won(S.goal-inc)}원</b> 많아요</span>`}
  else{gn.className="alloc ok";gn.innerHTML=`<span>수입의 <b class="num">${Math.round(S.goal/inc*100)}%</b>를 쓰고</span><span><b class="num">${won(inc-S.goal)}원</b>을 남겨요</span>`}
  const sum=S.cats.reduce((a,c)=>a+c.budget,0),diff=S.goal-sum,an=$("allocNote");

  else if(diff>0){an.className="alloc warn";an.innerHTML=`<span>아직 안 나눈 돈</span><b class="num">${won(diff)}원</b>`}
  else{an.className="alloc bad";an.innerHTML=`<span>목표보다 많이 나눴어요</span><b class="num">${won(-diff)}원 초과</b>`}
  $("fillRest").disabled=diff<=0;

    <div class="money sm"><input class="inp num" id="b-${esc(c.id)}" data-f="budget" inputmode="numeric" value="${c.budget?won(c.budget):""}" placeholder="0" aria-label="${esc(c.name)} 예산"></div>
    <button type="button" class="x${pendingDel===c.id?" confirm":""}" data-delcat="${esc(c.id)}" aria-label="${esc(c.name)} 빼기">${pendingDel===c.id?"삭제":"✕"}</button></div>`).join("")
    :`<div class="empty">위에서 항목을 눌러 예산을 넣어 보세요</div>`;
}
function renderIncome(){
  $("incTypes").innerHTML=INCOME_TYPES.map(([k,e,n])=>`<button type="button" class="chip" data-t="${k}" aria-pressed="${k===selInc}">${ic(e,18)}${n}</button>`).join("");

/* events */
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2400)}
function fmtInput(el){const v=parse(el.value);el.value=v?won(v):""}
function setTab(t){tab=t;pendingDel=null;render();try{localStorage.setItem("ttgb:tab",t)}catch(e){}}
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(b)setTab(b.dataset.tab)};
$("prevM").onclick=()=>go(-1);$("nextM").onclick=()=>go(1);
async function go(d){
  const i=META.periods.indexOf(P);
  P=d>0?(META.periods[i+1]||addPeriod(nextAfter(P))):(META.periods[i-1]||addPeriod(prevBefore(P)));
  pendingDel=null;openPeriod(false);S=await loadPeriod(P);setDateBounds();render()}
function setDateBounds(){const el=$("spDate");el.min=P.start;el.max=P.end;
  el.value=(todayStr>=P.start&&todayStr<=P.end)?todayStr:P.start}
/* 기간 바꾸기 */
function openPeriod(on){$("periodForm").hidden=!on;$("pErr").textContent="";
  if(on){$("pStart").value=P.start;$("pEnd").value=P.end;periodHint();$("periodForm").scrollIntoView({block:"nearest"})}}
function periodHint(){const a=$("pStart").value,b=$("pEnd").value;const h=$("pHint");
  if(!a||!b||b<a){h.textContent="시작일과 끝나는 날을 골라 주세요.";return}
  h.innerHTML=`<b>${shortD(a)} ~ ${shortD(b)}</b>, 총 <b>${daysBetween(a,b)+1}일</b>의 가계부예요. 다음 기간은 ${shortD(addDays(b,1))}부터 이어져요.`}
$("periodBtn").onclick=()=>openPeriod($("periodForm").hidden);
$("pCancel").onclick=()=>openPeriod(false);
$("pStart").addEventListener("input",periodHint);$("pEnd").addEventListener("input",periodHint);
$("pQuick").onclick=e=>{const b=e.target.closest("button");if(!b)return;const a=$("pStart").value||P.start;
  if(b.dataset.q==="month"){$("pEnd").value=addDays(addMonths(a,1),-1)}
  else{const f=a.slice(0,8)+"01";$("pStart").value=f;$("pEnd").value=addDays(addMonths(f,1),-1)}
  periodHint()};
$("pSave").onclick=()=>{const a=$("pStart").value,b=$("pEnd").value,er=$("pErr");
  if(!a||!b){er.textContent="날짜 두 개를 모두 골라 주세요.";return}
  if(b<a){er.textContent="끝나는 날이 시작일보다 빨라요.";return}
  if(daysBetween(a,b)>92){er.textContent="기간은 최대 93일까지 정할 수 있어요.";return}
  const clash=META.periods.find(x=>x!==P&&!(b<x.start||a>x.end));
  if(clash){er.textContent=`${shortD(clash.start)} ~ ${shortD(clash.end)} 기간과 겹쳐요. 날짜를 조금 바꿔 주세요.`;return}
  P.start=a;P.end=b;sortPeriods();metaDirty=true;
  if(S.sample)S=sampleState(P);
  const out=S.spends.filter(x=>x.date<a||x.date>b).length;
  openPeriod(false);setDateBounds();save();
  toast(out?`기간을 바꿨어요 · 기간 밖 지출 ${out}건도 그대로 남겨뒀어요`:`${shortD(a)} ~ ${shortD(b)} 가계부로 바꿨어요`)};

$("spAmt").addEventListener("input",e=>{fmtInput(e.target);updateHint();$("spErr").textContent=""});
$("quickAmt").onclick=e=>{const b=e.target.closest("button");if(!b)return;const v=Number(b.dataset.v);const el=$("spAmt");el.value=v?won(parse(el.value)+v):"";updateHint()};

function backupData(){const o={app:"cheesecookie",version:1,savedAt:new Date().toISOString(),data:{}};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("ttgb:"))o.data[k]=localStorage.getItem(k)}}catch(e){}return o}
$("bkSave").onclick=()=>{const blob=new Blob([JSON.stringify(backupData())],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`치즈쿠키가계부_백업_${todayStr}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  try{localStorage.setItem("ttgb-lastbackup",todayStr)}catch(e){}bkInfo();toast("백업 파일을 저장했어요")};
let pendingImport=null;
$("bkLoad").onclick=()=>$("bkFile").click();
$("bkFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const o=JSON.parse(await f.text());if(o.app!=="cheesecookie"||!o.data)throw 0;pendingImport=o;
    $("bkMsg").innerHTML=`${o.savedAt?o.savedAt.slice(0,10)+"에 만든 ":""}백업이에요. 불러오면 지금 기록이 이 백업으로 바뀌어요.`;$("bkConfirm").hidden=false}
  catch(err){$("bkMsg").textContent="치즈쿠키 가계부 백업 파일이 아니에요. 저장해 둔 .json 파일을 골라 주세요.";$("bkConfirm").hidden=true}};
$("bkNo").onclick=()=>{pendingImport=null;$("bkConfirm").hidden=true;bkInfo()};
$("bkYes").onclick=()=>{if(!pendingImport)return;
  try{Object.keys(localStorage).filter(k=>k.startsWith("ttgb:")).forEach(k=>localStorage.removeItem(k));
    Object.entries(pendingImport.data).forEach(([k,v])=>{if(k.startsWith("ttgb:"))localStorage.setItem(k,v)})}catch(e){}
  location.reload()};
function bkInfo(){let l=null;try{l=localStorage.getItem("ttgb-lastbackup")}catch(e){}
  $("bkMsg").textContent=l?`마지막 백업: ${shortD(l)}`:"아직 백업한 적 없어요. 기록은 이 폰에만 있어서, 한 달에 한 번쯤 백업해 두면 안심이에요."}
bkInfo();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
